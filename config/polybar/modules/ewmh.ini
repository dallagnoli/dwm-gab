[module/ewmh]
type = internal/xworkspaces

pin-workspaces = true
group-by-monitor = false

enable-click = false
enable-scroll = false

format = <label-state>

label-active = %index%
label-active-foreground = ${colors.nord4}
label-active-padding = 1

label-occupied = %{T2}%index%%{T-}
label-occupied-foreground = ${colors.nord3}
label-occupied-padding = 1

label-urgent = %{T3}%index%%{T-}
label-urgent-foreground = ${colors.nord11}
label-urgent-padding = 1

label-empty = 
